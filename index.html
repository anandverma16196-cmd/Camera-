<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iCam Pro Max 4K</title>
    <style>
        :root { --gold: #ffd700; --bg: #000; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Camera Frame - Reduced size to fit buttons */
        .viewport { position: relative; width: 100%; height: 65vh; background: #111; display: flex; align-items: center; overflow: hidden; border-bottom: 2px solid #222; }
        video { width: 100%; height: 100%; object-fit: cover; transition: filter 0.3s; }
        
        /* Filter Labels */
        .filter-scroll { width: 100%; overflow-x: auto; display: flex; gap: 10px; padding: 10px; background: #000; }
        .f-item { min-width: 70px; font-size: 10px; text-align: center; color: #888; cursor: pointer; }
        .f-item.active { color: var(--gold); font-weight: bold; }

        /* Control Panel */
        .panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; background: #000; padding: 5px; }
        
        .zoom-slider { width: 80%; accent-color: var(--gold); }
        .mode-switcher { font-size: 12px; display: flex; gap: 20px; color: #555; text-transform: uppercase; letter-spacing: 1px; }
        .mode-active { color: var(--gold); border-bottom: 2px solid var(--gold); }

        .shutter-row { width: 100%; display: flex; justify-content: space-around; align-items: center; }
        .shutter-outer { width: 65px; height: 65px; border-radius: 50%; border: 4px solid white; padding: 4px; display: flex; align-items: center; justify-content: center; }
        .shutter-inner { width: 100%; height: 100%; background: white; border-radius: 50%; transition: 0.3s; }
        .recording .shutter-inner { background: red; border-radius: 5px; transform: scale(0.7); }

        .btn-side { background: #222; border: none; width: 45px; height: 45px; border-radius: 50%; color: white; font-size: 20px; }
    </style>
</head>
<body>

<div class="viewport">
    <video id="video" autoplay playsinline></video>
</div>

<div class="filter-scroll" id="filterBar">
    <div class="f-item active" onclick="setF('none', this)">Original</div>
    <div class="f-item" onclick="setF('contrast(1.3) saturate(1.6)', this)">HD Vivid</div>
    <div class="f-item" onclick="setF('blur(5px)', this)">Blur Style</div>
    <div class="f-item" onclick="setF('grayscale(1)', this)">Black/White</div>
    <div class="f-item" onclick="setF('sepia(0.8) hue-rotate(-30deg)', this)">Retro</div>
</div>

<div class="panel">
    <div class="mode-switcher">
        <span id="mPhoto" class="mode-active">Photo</span>
        <span id="mVideo">Video</span>
    </div>

    <input type="range" class="zoom-slider" id="zoom" min="1" max="10" step="0.1" value="1">
    <div style="font-size: 12px; color: var(--gold);" id="zVal">1.0x</div>

    <div class="shutter-row">
        <button class="btn-side" onclick="switchCam()">🔄</button>
        <div class="shutter-outer" onclick="mainAction()">
            <div class="shutter-inner" id="shutterBtn"></div>
        </div>
        <button class="btn-side" id="modeBtn" onclick="toggleMode()">🎥</button>
    </div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    const video = document.getElementById('video');
    const zoom = document.getElementById('zoom');
    const shutterBtn = document.getElementById('shutterBtn');
    let track, recorder, chunks = [], isVideo = false, isRecording = false;

    async function startCam(facing = "environment") {
        if (track) track.stop();
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: facing, width: { ideal: 3840 }, height: { ideal: 2160 } }
        });
        video.srcObject = stream;
        track = stream.getVideoTracks()[0];
    }

    function toggleMode() {
        isVideo = !isVideo;
        document.getElementById('modeBtn').innerText = isVideo ? "📸" : "🎥";
        document.getElementById('mVideo').className = isVideo ? "mode-active" : "";
        document.getElementById('mPhoto').className = isVideo ? "" : "mode-active";
    }

    async function mainAction() {
        if (!isVideo) {
            // Take High-Res Photo
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.filter = video.style.filter;
            ctx.drawImage(video, 0, 0);
            save(canvas.toDataURL('image/jpeg', 1.0), "Photo.jpg");
        } else {
            // Video Record Logic
            if (!isRecording) {
                chunks = [];
                recorder = new MediaRecorder(video.srcObject, { mimeType: 'video/webm;codecs=vp8', bitsPerSecond: 5000000 });
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/mp4' });
                    save(URL.createObjectURL(blob), "Video.mp4");
                };
                recorder.start();
                isRecording = true;
                document.querySelector('.shutter-outer').classList.add('recording');
            } else {
                recorder.stop();
                isRecording = false;
                document.querySelector('.shutter-outer').classList.remove('recording');
            }
        }
    }

    function save(url, name) {
        const a = document.createElement('a');
        a.href = url; a.download = name; a.click();
    }

    function setF(f, el) {
        video.style.filter = f;
        document.querySelectorAll('.f-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
    }

    zoom.oninput = () => {
        const val = zoom.value;
        document.getElementById('zVal').innerText = val + "x";
        video.style.transform = `scale(${val})`;
        if (track.getCapabilities().zoom) track.applyConstraints({advanced: [{zoom: val}]});
    };

    let currentFace = "environment";
    function switchCam() {
        currentFace = currentFace === "environment" ? "user" : "environment";
        startCam(currentFace);
    }

    startCam();
</script>
</body>
</html>
