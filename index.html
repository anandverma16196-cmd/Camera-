<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iCam Pro Max 4K</title>
    <style>
        :root { --gold: #ffd700; }
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
        body { background: #000; color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Camera Viewport - Height reduced to 55% to ensure buttons are high up */
        .viewport { position: relative; width: 100%; height: 55vh; background: #111; display: flex; align-items: center; justify-content: center; overflow: hidden; border-bottom: 2px solid #333; }
        
        /* Rotation Fix: Ensuring video doesn't flip incorrectly */
        video { width: 100%; height: 100%; object-fit: cover; transition: filter 0.3s, transform 0.2s cubic-bezier(0.1, 0.7, 1.0, 0.1); }

        /* Scrollable Filters - Premium Look */
        .filter-container { background: #000; padding: 10px 0; border-bottom: 1px solid #222; }
        .filter-scroll { display: flex; overflow-x: auto; gap: 15px; padding: 0 15px; scrollbar-width: none; }
        .filter-scroll::-webkit-scrollbar { display: none; }
        .f-box { min-width: 60px; text-align: center; }
        .f-preview { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #444; margin-bottom: 5px; background: #222; overflow: hidden; }
        .f-box.active .f-preview { border-color: var(--gold); }
        .f-box p { font-size: 9px; color: #888; }

        /* Control Panel - Lifted up */
        .panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; background: #000; padding: 10px 0 30px 0; }
        
        .zoom-section { width: 80%; text-align: center; }
        .zoom-slider { width: 100%; accent-color: var(--gold); height: 10px; }
        
        .shutter-row { width: 100%; display: flex; justify-content: space-around; align-items: center; }
        .shutter-btn { width: 60px; height: 60px; border-radius: 50%; border: 4px solid white; background: none; display: flex; align-items: center; justify-content: center; }
        .shutter-inner { width: 48px; height: 48px; background: white; border-radius: 50%; transition: 0.2s; }
        .shutter-inner:active { transform: scale(0.8); background: #ccc; }

        .icon-btn { background: #222; border: none; width: 40px; height: 40px; border-radius: 50%; color: white; font-size: 18px; }
    </style>
</head>
<body>

<div class="viewport">
    <video id="video" autoplay playsinline></video>
</div>

<div class="filter-container">
    <div class="filter-scroll" id="fScroll">
        <div class="f-box active" onclick="setFilter('none', this)"><div class="f-preview"></div><p>Original</p></div>
        <div class="f-box" onclick="setFilter('saturate(2) contrast(1.1)', this)"><div class="f-preview" style="background: #ffeb3b;"></div><p>Vivid</p></div>
        <div class="f-box" onclick="setFilter('grayscale(1)', this)"><div class="f-preview" style="background: #555;"></div><p>B&W</p></div>
        <div class="f-box" onclick="setFilter('sepia(0.6) brightness(1.1)', this)"><div class="f-preview" style="background: #795548;"></div><p>Chrome</p></div>
        <div class="f-box" onclick="setFilter('hue-rotate(180deg)', this)"><div class="f-preview" style="background: #2196f3;"></div><p>Cool</p></div>
        <div class="f-box" onclick="setFilter('blur(4px)', this)"><div class="f-preview" style="background: #9e9e9e; opacity: 0.5;"></div><p>Soft Blur</p></div>
        <div class="f-box" onclick="setFilter('invert(1)', this)"><div class="f-preview" style="background: #fff;"></div><p>X-Ray</p></div>
        <div class="f-box" onclick="setFilter('brightness(1.5) contrast(0.9)', this)"><div class="f-preview" style="background: #eee;"></div><p>High-Key</p></div>
    </div>
</div>

<div class="panel">
    <div class="zoom-section">
        <p id="zVal" style="font-size: 12px; color: var(--gold); margin-bottom: 5px;">1.0x</p>
        <input type="range" class="zoom-slider" id="zoom" min="1" max="10" step="0.1" value="1">
    </div>

    <div class="shutter-row">
        <button class="icon-btn" onclick="switchCam()">🔄</button>
        <button class="shutter-btn" onclick="takeAction()">
            <div class="shutter-inner" id="shIn"></div>
        </button>
        <button class="icon-btn" id="modeBtn" onclick="toggleMode()">📸</button>
    </div>
    <p id="modeText" style="font-size: 10px; color: #444;">PHOTO MODE</p>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    const video = document.getElementById('video');
    const zoom = document.getElementById('zoom');
    const zVal = document.getElementById('zVal');
    let track, mode = "environment", isVideoMode = false;

    async function init(facing) {
        if (track) track.stop();
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { 
                    facingMode: facing,
                    width: { ideal: 4096 }, // Asking for 4K
                    height: { ideal: 2160 }
                }
            });
            video.srcObject = stream;
            track = stream.getVideoTracks()[0];
            
            // Focus & Quality Fix
            const cap = track.getCapabilities();
            if(cap.focusMode) track.applyConstraints({advanced: [{focusMode: "continuous"}]});
        } catch (e) { alert("Camera error or permission denied."); }
    }

    // Zoom without Pixelation
    zoom.oninput = () => {
        const v = zoom.value;
        zVal.innerText = v + "x";
        
        // CSS Zoom with smoothing
        video.style.transform = `scale(${v})`;
        
        // Hardware Zoom (True Quality)
        if (track && track.getCapabilities().zoom) {
            track.applyConstraints({advanced: [{zoom: v}]});
        }
    };

    function setFilter(f, el) {
        video.style.filter = f;
        document.querySelectorAll('.f-box').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
    }

    function toggleMode() {
        isVideoMode = !isVideoMode;
        document.getElementById('modeBtn').innerText = isVideoMode ? "🎥" : "📸";
        document.getElementById('modeText').innerText = isVideoMode ? "VIDEO MODE" : "PHOTO MODE";
    }

    function takeAction() {
        const canvas = document.getElementById('canvas');
        // Quality fix: taking raw video dimensions
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        
        // Anti-aliasing for zoom
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        
        ctx.filter = getComputedStyle(video).filter;
        ctx.drawImage(video, 0, 0);
        
        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/jpeg', 1.0);
        link.download = `PRO_CAPTURE_${Date.now()}.jpg`;
        link.click();
    }

    function switchCam() {
        mode = mode === "environment" ? "user" : "environment";
        init(mode);
    }

    init(mode);
</script>
</body>
</html>
