<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iCam Pro Max Ultra</title>
    <style>
        :root { --gold: #ffd700; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Camera Viewport */
        .viewport { flex: 1; position: relative; background: #000; display: flex; align-items: center; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; transition: filter 0.3s; }
        
        /* Exposure Slider (Vertical) */
        .exp-container { position: absolute; right: 20px; height: 50%; display: flex; flex-direction: column; align-items: center; z-index: 10; }
        .exp-slider { appearance: none; width: 150px; height: 4px; background: rgba(255,255,255,0.3); transform: rotate(-90deg); margin-top: 70px; border-radius: 5px; }

        /* Filter Tabs */
        .filter-bar { position: absolute; bottom: 10px; width: 100%; display: flex; justify-content: center; gap: 10px; z-index: 5; }
        .f-btn { background: rgba(0,0,0,0.5); border: 1px solid #555; color: #fff; padding: 5px 12px; border-radius: 15px; font-size: 11px; }
        .f-btn.active { border-color: var(--gold); color: var(--gold); }

        /* UI Panel */
        .ui-panel { background: #000; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .zoom-info { font-size: 12px; color: var(--gold); font-weight: bold; }
        .shutter-group { width: 100%; display: flex; justify-content: space-around; align-items: center; }
        
        .shutter { width: 70px; height: 70px; border-radius: 50%; border: 4px solid #fff; padding: 4px; background: none; }
        .shutter-in { width: 100%; height: 100%; background: #fff; border-radius: 50%; transition: 0.2s; }
        .shutter.recording .shutter-in { background: #ff3b30; border-radius: 5px; transform: scale(0.7); }

        .preview { width: 45px; height: 45px; border-radius: 8px; border: 1px solid #444; object-fit: cover; }
    </style>
</head>
<body>

<div class="viewport">
    <video id="video" autoplay playsinline></video>
    
    <div class="exp-container">
        <span style="font-size: 18px;">☀️</span>
        <input type="range" class="exp-slider" id="exp" min="-2" max="2" step="0.1" value="0">
    </div>

    <div class="filter-bar">
        <button class="f-btn active" onclick="setFilter('none', this)">Original</button>
        <button class="f-btn" onclick="setFilter('contrast(1.2) saturate(1.5)', this)">Vivid</button>
        <button class="f-btn" onclick="setFilter('grayscale(1)', this)">B&W</button>
        <button class="f-btn" onclick="setFilter('sepia(0.5) brightness(1.1)', this)">Warm</button>
    </div>
</div>

<div class="ui-panel">
    <div class="zoom-info" id="zLabel">1.0x</div>
    <input type="range" style="width:80%; accent-color:var(--gold)" id="zoom" min="1" max="10" step="0.1" value="1">
    
    <div class="shutter-group">
        <img id="prevImg" class="preview" src="">
        <button class="shutter" id="shutterBtn" onclick="handleCapture()"><div class="shutter-in"></div></button>
        <button onclick="switchCam()" style="background:none; border:none; font-size:25px;">🔄</button>
    </div>
    <p id="status" style="font-size: 10px; color: #555;">Hold shutter for Video</p>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    const video = document.getElementById('video');
    const zoom = document.getElementById('zoom');
    const exp = document.getElementById('exp');
    let track, recorder, chunks = [];
    let isRecording = false;

    async function init(face = "environment") {
        if (track) track.stop();
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: face, width: { ideal: 3840 }, height: { ideal: 2160 } }
            });
            video.srcObject = stream;
            track = stream.getVideoTracks()[0];
        } catch (e) { alert("Use HTTPS or Localhost for Camera"); }
    }

    // Pro Zoom & Exposure
    zoom.oninput = () => {
        const v = zoom.value;
        document.getElementById('zLabel').innerText = v + "x";
        video.style.transform = `scale(${v})`;
        if (track && track.getCapabilities().zoom) track.applyConstraints({advanced: [{zoom: v}]});
    };

    exp.oninput = () => {
        if (track && track.getCapabilities().exposureCompensation) {
            track.applyConstraints({advanced: [{exposureCompensation: exp.value}]});
        } else {
            video.style.filter = `brightness(${1 + parseFloat(exp.value)/2})`;
        }
    };

    function setFilter(f, btn) {
        video.style.filter = f;
        document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function handleCapture() {
        const canvas = document.getElementById('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        
        // Apply Filters to Photo
        ctx.filter = getComputedStyle(video).filter;
        ctx.drawImage(video, 0, 0);
        
        const data = canvas.toDataURL('image/jpeg', 1.0);
        document.getElementById('prevImg').src = data;
        
        // Download
        const a = document.createElement('a');
        a.href = data;
        a.download = `PRO_IMG_${Date.now()}.jpg`;
        a.click();
    }

    // Camera Switcher
    let mode = "environment";
    function switchCam() {
        mode = mode === "environment" ? "user" : "environment";
        init(mode);
    }

    init();
</script>
</body>
</html>
